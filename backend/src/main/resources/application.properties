# PostgreSQL Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:app}
quarkus.datasource.password=${DB_PASSWORD:app}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/db}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true

# MinIO / S3
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.region=${MINIO_REGION:us-east-1}
minio.bucket-name=${MINIO_BUCKET_NAME}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Image processing
image.webp.encoder=${WEBP_ENCODER:cwebp}

# Keycloak
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/hamta}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:backend}
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.0
