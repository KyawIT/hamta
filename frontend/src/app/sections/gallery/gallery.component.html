<section id="galerie" class="py-24 lg:py-36 bg-[#131313]"><div class="max-w-7xl mx-auto px-5 lg:px-10">
  <div appFadeIn class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-12 lg:mb-16"><div><app-section-label class="block mb-5">Galerie</app-section-label><h2 class="text-4xl lg:text-5xl text-[#e5e2e1]">Jedes Gericht erzählt<br/><em class="italic text-[#f2ca50]">eine Geschichte</em></h2></div><p class="text-sm leading-7 max-w-xs text-[#4a4640]">Frisch aus der Küche – täglich zubereitete Gerichte aus besten Zutaten.</p></div>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 lg:gap-3 [grid-auto-rows:200px]">
    @for (image of images; track image.src; let i = $index) { <div appFadeIn [fadeDelay]="i * 40" class="img-zoom relative overflow-hidden group" [class.row-span-2]="image.span === 'row-span-2'"><img [src]="image.src" [alt]="image.alt" loading="lazy" class="absolute inset-0 w-full h-full object-cover transition-all duration-700 group-hover:scale-110 group-hover:brightness-75"/><div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4 [background:linear-gradient(to_top,rgba(14,14,14,.8)_0%,transparent_60%)]"><span class="text-xs font-semibold uppercase tracking-widest text-[#f2ca50] [letter-spacing:.08em]">{{ image.alt }}</span></div></div> }
  </div>
</div></section>
